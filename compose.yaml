name: medtrace

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: medtrace
      POSTGRES_USER: medtrace
      POSTGRES_PASSWORD: medtrace_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  aws-emulator:
    build: ./infra/aws-emulator
    environment:
      EMULATOR_TELEMETRY: "off"
    ports:
      - "127.0.0.1:9297:9297"
    volumes:
      - aws_emulator_connection:/home/emulator/.aws/emulator/9297
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/home/emulator/.aws/emulator/9297/ca.pem", "https://127.0.0.1:9297/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 15
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://medtrace:medtrace_dev@db:5432/medtrace
    volumes:
      - aws_emulator_connection:/run/aws-emulator:ro
    depends_on:
      db:
        condition: service_healthy
      aws-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      target: web
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  aws_emulator_connection:
